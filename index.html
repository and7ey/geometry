<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="GeoMaster — учебник-тренажёр по геометрии 7–8 класса: определения, свойства, признаки, теоремы, карточки, тесты и интервальное повторение."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>GeoMaster — геометрия 7–8</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('geomaster.v1');
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : 'system';
          var dark =
            theme === 'dark' ||
            ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
